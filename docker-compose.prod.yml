version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_S3_PUBLIC_BASE_URL=${AWS_S3_PUBLIC_BASE_URL}
      - SENTRY_DSN=${SENTRY_DSN}
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN}
      - SENTRY_ORG=${SENTRY_ORG}
      - SENTRY_PROJECT=${SENTRY_PROJECT}
    volumes:
      - next_static:/app/.next/static
      - public_assets:/app/public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workora_prod_net

  nginx:
    image: nginx:1.25-alpine
    container_name: workora_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
      - next_static:/var/www/workora/.next/static:ro
      - public_assets:/var/www/workora/public:ro
    depends_on:
      - app
    networks:
      - workora_prod_net

  postgres:
    image: postgres:16-alpine
    container_name: workora_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workora_pass}
      POSTGRES_DB: ${POSTGRES_DB:-workora_prod}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workora} -d ${POSTGRES_DB:-workora_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workora_prod_net

  redis:
    image: redis:7-alpine
    container_name: workora_prod_redis
    restart: always
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workora_prod_net

networks:
  workora_prod_net:
    driver: bridge

volumes:
  pgdata_prod:
  redisdata_prod:
  next_static:
  public_assets:
