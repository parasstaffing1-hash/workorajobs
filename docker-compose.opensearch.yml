version: '3.8'

services:
  opensearch-node1:
    image: opensearchproject/opensearch:2.13.0
    container_name: workora-opensearch-node1
    environment:
      - cluster.name=workora-search-cluster
      - node.name=workora-opensearch-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - 9200:9200
      - 9600:9600
    networks:
      - workora-network
    restart: always

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: workora-opensearch-dashboards
    ports:
      - 5601:5601
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch-node1:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    networks:
      - workora-network
    depends_on:
      - opensearch-node1
    restart: always

volumes:
  opensearch-data:
    driver: local

networks:
  workora-network:
    driver: bridge
