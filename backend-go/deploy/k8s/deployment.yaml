apiVersion: apps/v1
kind: Deployment
metadata:
  name: workora-backend-go
  namespace: default
  labels:
    app: workora-backend-go
spec:
  replicas: 3
  selector:
    matchLabels:
      app: workora-backend-go
  template:
    metadata:
      labels:
        app: workora-backend-go
    spec:
      containers:
      - name: server
        image: workorajobs/backend-go:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "8080"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: workora-secrets
              key: DATABASE_URL
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /api/v1/health/liveness
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health/readiness
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: workora-backend-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: workora-backend-go
  ports:
  - port: 8080
    targetPort: 8080
    name: http
