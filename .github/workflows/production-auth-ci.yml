name: Production Authentication CI/CD Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-auth:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: workora
          POSTGRES_PASSWORD: workora_password
          POSTGRES_DB: workora_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Environment & Secret Configurations
        run: pnpm exec tsx -e "import { EnvValidator } from './src/lib/config/env-validator'; EnvValidator.validate();"
        env:
          DATABASE_URL: "postgresql://workora:workora_password@localhost:5432/workora_test_db?schema=public"
          JWT_SECRET: "ci-testing-super-secret-jwt-key-32-chars-long!"
          REDIS_URL: "redis://localhost:6379"
          NODE_ENV: "production"

      - name: Run Prisma Migration & Generation
        run: |
          pnpm exec prisma generate
          pnpm exec prisma db push --skip-generate
        env:
          DATABASE_URL: "postgresql://workora:workora_password@localhost:5432/workora_test_db?schema=public"

      - name: Typecheck TypeScript Codebase
        run: pnpm exec tsc --noEmit

      - name: Run Unit Tests
        run: pnpm exec jest tests/unit --runInBand

      - name: Build Production Next.js Bundle
        run: pnpm build
        env:
          DATABASE_URL: "postgresql://workora:workora_password@localhost:5432/workora_test_db?schema=public"
          JWT_SECRET: "ci-testing-super-secret-jwt-key-32-chars-long!"

      - name: Validate AWS Deployment Script
        run: bash -n scripts/deploy-ec2-ssm.sh
