name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js Application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Package Standalone Artifacts
        run: |
          mkdir -p build_output
          cp -r .next/standalone/* build_output/
          mkdir -p build_output/.next
          cp -r .next/static build_output/.next/
          cp -r public build_output/
          tar -czf release_bundle.tar.gz -C build_output .

      - name: Deploy to AWS EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "release_bundle.tar.gz"
          target: "/tmp/"

      - name: Restart Web Services on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo tar -xzf /tmp/release_bundle.tar.gz -C /opt/workora/runtime/
            rm -f /tmp/release_bundle.tar.gz
            sudo systemctl restart workora-web
            sudo systemctl reload nginx
