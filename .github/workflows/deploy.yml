name: Production Deployment

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy through AWS Systems Manager
        env:
          INSTANCE_ID: i-0df95064eca6a7a15
        run: |
          REMOTE_COMMAND="curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/scripts/deploy-ec2-ssm.sh | bash -s -- ${GITHUB_SHA}"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy Workora ${GITHUB_SHA}" \
            --timeout-seconds 3600 \
            --parameters commands="${REMOTE_COMMAND}" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 180); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "${STATUS}" in
              Success)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "${COMMAND_ID}" --instance-id "${INSTANCE_ID}" --output json
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Deployment command did not finish within 30 minutes." >&2
          exit 1
